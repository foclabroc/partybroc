<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PartyBroc : jeux de soirée, la TV affiche, les téléphones jouent.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PartyBroc">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#17102B">
  <title>PartyBroc</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#17102B;margin:0">
  <!-- Écran de chargement (retiré dès que l'appli s'affiche) -->
  <div id="pb-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:#F7F2FF;text-align:center;padding:24px">
    <div style="font-size:42px;font-weight:bold">Party<span style="color:#FF4FA3">Broc</span> 🎉</div>
    <div style="margin-top:12px;color:#B3A6D9;font-size:18px">Chargement…</div>
    <div id="pb-status" style="display:none;margin-top:24px;max-width:720px;color:#FFB3B3;font-size:18px;line-height:1.4"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
