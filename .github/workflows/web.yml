# Compile le site Flutter à chaque push sur main et le publie dans la
# release « web-latest » (partybroc-web.zip). Le script deploy.ps1 du serveur
# va le chercher là.
name: web

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compiler
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --wasm --no-web-resources-cdn
          cd build/web && zip -qr ../../../partybroc-web.zip .

      - name: Publier dans la release web-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view web-latest >/dev/null 2>&1 || \
            gh release create web-latest --title "Site web (dernière version)" --notes "Construit automatiquement depuis main." --latest=false
          gh release upload web-latest partybroc-web.zip --clobber
          gh release edit web-latest --notes "Construit automatiquement depuis main (${GITHUB_SHA::7})."
