# Compile les deux applis Android et les publie dans la release « tv-latest » :
#   PartyBroc TV (--flavor tv)       → partybroc-tv.apk + tv-version.json
#   PartyBroc téléphone (--flavor phone) → partybroc.apk + phone-version.json
#   assetlinks.json : copié par deploy.ps1 dans web/.well-known/ (les liens /play ouvrent l'appli)
# Elle ne tourne que si la clé de signature est dans les
# secrets du dépôt (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64  le fichier partybroc-tv.jks encodé en base64
#   ANDROID_KEYSTORE_PASSWORD  son mot de passe (alias : partybroc)
# Toujours la même clé, sinon Android refuse la mise à jour.
name: apk

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Clé de signature présente ?
        id: key
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ]; then
            echo "Secrets ANDROID_KEYSTORE_* absents : APK non compilé." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ok == 'true'
        with:
          channel: stable
          cache: true

      - name: Compiler
        if: steps.key.outputs.ok == 'true'
        working-directory: app
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/partybroc-tv.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=partybroc\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/partybroc-tv.jks" "$KEYSTORE_PW" "$KEYSTORE_PW" > android/key.properties
          flutter pub get
          # un téléchargement raté chez GitHub (ex. CMake corrompu) : on réessaie une fois
          build() {
            flutter build apk --release --flavor "$1" --target-platform android-arm,android-arm64 || {
              echo "Échec, nouvel essai dans 20 s"; sleep 20
              rm -rf "$ANDROID_HOME/cmake" 2>/dev/null || true
              flutter build apk --release --flavor "$1" --target-platform android-arm,android-arm64
            }
          }
          build tv
          cp build/app/outputs/flutter-apk/app-tv-release.apk ../partybroc-tv.apk
          build phone
          cp build/app/outputs/flutter-apk/app-phone-release.apk ../partybroc.apk
          # Empreinte de la clé : le site déclare que les liens /play peuvent ouvrir l'appli téléphone
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/partybroc-tv.jks" -alias partybroc -storepass "$KEYSTORE_PW" \
            | grep -E '^\s*SHA256:' | head -1 | sed -E 's/^\s*SHA256:\s*//')
          test -n "$FP"
          jq -n --arg fp "$FP" '[{relation: ["delegate_permission/common.handle_all_urls"],
            target: {namespace: "android_app", package_name: "com.foclabroc.partybroc.play", sha256_cert_fingerprints: [$fp]}}]' > ../assetlinks.json
          cat ../assetlinks.json
          rm -f android/key.properties "$RUNNER_TEMP/partybroc-tv.jks"
          # Fichiers lus par les applis pour savoir si une mise à jour existe
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//')
          NAME=${VER%%+*}; CODE=${VER##*+}
          NOTES=$(git log -1 --pretty=%s | head -c 300)
          jq -n --arg name "$NAME" --argjson code "$CODE" --arg notes "$NOTES" \
            '{versionName: $name, versionCode: $code, notes: $notes}' > ../tv-version.json
          cp ../tv-version.json ../phone-version.json
          cat ../tv-version.json

      - name: Publier dans la release tv-latest
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tv-latest >/dev/null 2>&1 || \
            gh release create tv-latest --title "Applis Android (dernière version)" --notes "Construite automatiquement depuis main." --latest=false
          # les APK d'abord, les fichiers de version ensuite (jamais de version annoncée sans son APK)
          gh release upload tv-latest partybroc-tv.apk partybroc.apk assetlinks.json --clobber
          gh release upload tv-latest tv-version.json phone-version.json --clobber
          gh release edit tv-latest --notes "Construite automatiquement depuis main (${GITHUB_SHA::7})."
